function aiPanel(){const a=article();const included=a.materials.filter(m=>m.included).length;return `<div class="row between"><span class="row ai-heading">${ico('spark')}AI 协作</span><button class="icon-btn" data-action="ai-close" aria-label="收起 AI 协作">${ico('close')}</button></div><p class="intro">你的素材与观点为核心。<br>我帮你理清思路，修改由你决定。</p><div class="ai-context"><b>当前文章上下文</b><p style="margin-top:6px">${included} 份素材 · ${a.outline.length} 个章节</p><p style="margin-top:3px">只参考勾选的素材</p></div><h3 style="font-size:12px">这次需要什么帮助？</h3><div class="action-grid">${[['outline','list','整理提纲'],['draft','pen','起草章节'],['polish','spark','润色选段'],['review','check','检查表达']].map(([key,icon,label])=>`<button data-ai="${key}" class="${aiAction===key?'active':''}">${ico(icon)}${label}</button>`).join('')}</div><label class="field"><span>${aiAction==='draft'?'选择起草章节':'写给谁看'}</span>${aiAction==='draft'?`<select id="draft-chapter">${(a.outline.length?a.outline:['自由章节']).map((o,i)=>`<option value="${i}" ${String(i)===chapterChoice?'selected':''}>${escapeHTML(o)}</option>`).join('')}</select>`:`<select id="reader">${['有基础的技术读者','刚接触这个主题的读者','写给未来的自己'].map(r=>`<option ${r===readerChoice?'selected':''}>${r}</option>`).join('')}</select>`}</label><label class="field"><span>补充你的要求</span><textarea id="ai-request" placeholder="比如：保留技术细节，写得自然一点。不要扩展没有依据的结论。" rows="3">${escapeHTML(aiRequest)}</textarea></label><button class="btn primary" data-action="generate">${ico('spark')}生成演示建议</button><p class="ai-foot">AI 演示 · 未接入真实模型</p><div id="suggestion-slot">${suggestionHTML()}</div>${undo?'<button class="btn quiet" data-action="undo">'+ico('undo')+'撤销最近一次 AI 修改</button>':''}`}
function suggestionHTML(){if(!suggestion||suggestion.articleId!==activeId)return '';const stale=article().revision!==suggestion.baseRevision;return `<div class="suggestion"><div class="row between"><b>${{outline:'提纲建议',draft:'章节草稿',polish:'选段修改',review:'表达检查'}[suggestion.action]}</b><span class="tag">演示</span></div><p class="version">${stale?'正文或提纲已变化，请重新生成':'先看一遍，再决定是否采用。'}</p><div class="compare">${suggestion.before?`<b>原文</b><pre class="before">${escapeHTML(suggestion.before)}</pre>`:''}<b>${suggestion.action==='review'?'检查建议':'建议内容'}</b><pre>${escapeHTML(suggestion.after)}</pre></div>${suggestion.action!=='review'?`<button class="btn primary" data-action="accept" ${stale?'disabled':''}>${ico('check')}采用${suggestion.action==='outline'?'提纲':suggestion.action==='draft'?'并插入正文':'修改'}</button>`:''}<button class="btn quiet" data-action="ignore">忽略这条建议</button></div>`}
function markdown(source){let code=false,list=false,html='';const inline=s=>escapeHTML(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');for(const line of source.split('\n')){if(line.startsWith('```')){if(list){html+='</ul>';list=false}html+=code?'</code></pre>':'<pre><code>';code=!code;continue}if(code){html+=escapeHTML(line)+'\n';continue}if(!line.startsWith('- ')&&list){html+='</ul>';list=false}const heading=line.match(/^(#{1,3}) (.+)/);if(heading)html+=`<h${heading[1].length} id="heading-${escapeHTML(heading[2])}">${inline(heading[2])}</h${heading[1].length}>`;else if(line.startsWith('- ')){if(!list){html+='<ul>';list=true}html+='<li>'+inline(line.slice(2))+'</li>'}else if(line.startsWith('> '))html+='<blockquote>'+inline(line.slice(2))+'</blockquote>';else if(line.trim())html+='<p>'+inline(line)+'</p>'}if(code)html+='</code></pre>';if(list)html+='</ul>';return html}

function generate(){const a=article(),requirements=$('#ai-request').value.trim();if(aiAction==='polish'&&(!selected.text||a.body.slice(selected.start,selected.end)!==selected.text)){toast('请先在正文编辑区选中需要润色的文字。');return}const materials=a.materials.filter(m=>m.included);const points=materials.filter(m=>m.kind==='观点'||m.kind==='文字');const context=points.map(m=>m.content).join('\n');let after='',before='',target={start:selected.start,end:selected.end};if(aiAction==='outline'){after=['要解决的具体问题','实现思路与关键步骤','结合代码说明','实践中的取舍','我的理解与下一步'].join('\n');before=a.outline.join('\n')}else if(aiAction==='draft'){const idx=Number($('#draft-chapter').value);const chapter=a.outline[idx]||'自由章节';after=`\n\n## ${chapter}\n\n${context||'【待补充】这里需要加入你自己的观点与实践材料。'}\n\n【待补充】用一个具体的例子说明这段理解，并补上依据。${requirements?'\n\n作者要求：'+requirements:''}`;target={start:a.body.length,end:a.body.length}}else if(aiAction==='polish'){before=selected.text;after=before.replace(/非常非常/g,'很').replace(/其实其实/g,'其实').replace(/然后然后/g,'然后').replace(/进行一个/g,'进行').replace(/我们可以看到/g,'可以看到').replace(/总的来说，/g,'').replace(/。\s*。/g,'。');if(after===before)after='我的理解是：'+before}else{after=`1. 检查每个结论是否有代码、实验或出处支持。\n2. 把“我如何理解”与“已验证的事实”分开写。\n3. ${a.body.length<150?'正文还比较短，可以先补充一个具体示例。':'检查长段落是否可以拆成“问题、做法、结果”。'}\n4. ${materials.length?'当前素材为 '+materials.length+' 份，建议核对正文引用。':'尚未选中素材，有技术结论时请补充依据。'}\n\n这是演示检查清单，未核验技术事实。`}

function settings(){modal('个人空间设置','<p class="muted small">设置分类示意。真实配置接入将在后续完成。</p><div class="settings-item"><b>外观与工作空间</b><p>暖白背景 · 清晰文字导航 · 专注写作</p></div><div class="settings-item"><b>写作与偏好</b><p>以你的素材和理解为核心；AI 修改先查看再采用。</p></div><div class="settings-item"><b>AI 与连接</b><p>模型、工具与记忆管理将在系统接入阶段配置。</p></div><div class="settings-item"><b>数据与隐私</b><p>当前状态只在内存中保留。刷新恢复示例；没有后端保存或模型请求。</p></div>','<button type="button" class="btn primary" data-cancel>知道了</button>')}
function chatSend(text){if(!text.trim()){toast('先写下一件想做的事。');return}let c=conversations.find(c=>c.id===conversationId);if(!c){c={id:'c'+(++counter),title:text.trim().slice(0,22),messages:[]};conversations.unshift(c);conversationId=c.id}if(!c.messages.length)c.title=text.trim().slice(0,22);c.messages.push({role:'user',text:text.trim()},{role:'assistant',text:'可以先把这件事拆成三个问题：你想得到什么结果、手头有哪些材料、下一步能做什么。\n\n如果是技术写作，先记录你想讲清楚的问题和自己的观点，再逐步加入代码与资料。\n\n这是交互原型的固定演示回复，没有调用真实 AI。'});navigate('assistant')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.closest('dialog'))return;const d=b.dataset;if(d.nav){navigate(d.nav);return}if(d.open){openArticle(d.open);return}if(d.template!=null){newArticle(Number(d.template),$('#topic-prompt')?.value||'');return}if(d.filter){filter=d.filter;render();return}if(d.view){view=d.view;render();return}if(d.left){leftTab=d.left;render();return}if(d.ai){captureOptions();aiAction=d.ai;$('#dialog').open&&$('#dialog').close();$('.ai-panel').innerHTML=aiPanel();return}if(d.material){materialForm(d.material);return}if(d.copy){const a=articles.find(a=>a.id===d.copy),copy=JSON.parse(JSON.stringify(a));copy.id='a'+(++counter);copy.title+='（副本）';copy.sample=false;copy.updated='刚刚';copy.revision=0;articles.unshift(copy);dirty=true;render();toast('已创建文章副本。');return}if(d.delete){confirmDelete('删除这篇文章？','当前访问中的草稿会被移除，其他文章不受影响。',()=>{articles=articles.filter(a=>a.id!==d.delete);render()});return}if(d.cite){const m=article().materials.find(m=>m.id===d.cite);insertBody(m.kind==='链接'?`\n\n参考：[${m.title.replace(/[\[\]]/g,'')}](${m.content})\n`:m.kind==='代码'?'\n\n```\n'+m.content+'\n```\n':`\n\n> ${m.content.replace(/\n/g,'\n> ')}\n`);toast('已插入素材引用；引用不代表已核验内容。');return}if(d.rename!=null){editOutline(Number(d.rename));return}if(d.removeOutline!=null){const i=Number(d.removeOutline);confirmDelete('删除这个提纲章节？','只移除提纲条目，已经写下的正文保留。',()=>{article().outline.splice(i,1);touch(article());render()});return}if(d.move!=null){const a=article(),i=Number(d.move),j=i+Number(d.direction);if(j>=0&&j<a.outline.length){[a.outline[i],a.outline[j]]=[a.outline[j],a.outline[i]];touch(a);render()}return}if(d.insert!=null){insertBody('\n\n## '+article().outline[Number(d.insert)]+'\n\n');return}if(d.jump!=null){const title=article().outline[Number(d.jump)];if(view==='edit'){const t=$('#body-editor'),pos=article().body.indexOf('## '+title);if(pos<0){toast('正文还没有这个章节，可以先插入标题。');return}t.focus();t.setSelectionRange(pos,pos+title.length+3);selected={start:pos,end:pos+title.length+3,text:article().body.slice(pos,pos+title.length+3)}}else{const h=[...$('#markdown-preview').querySelectorAll('h1,h2,h3')].find(h=>h.textContent===title);h?h.scrollIntoView({block:'center'}):toast('正文还没有这个章节，可以先插入标题。')}return}if(d.conversation){conversationId=d.conversation;navigate('assistant');return}
switch(d.action){case'home-send':chatSend($('#home-prompt').value);break;case'start-topic':if(!$('#topic-prompt').value.trim()){toast('先写下一个你想讲清楚的主题。');$('#topic-prompt').focus()}else newArticle(-1,$('#topic-prompt').value);break;case'new':newArticle();break;case'clear-filter':query='';filter='全部';render();break;case'material-new':materialForm();break;case'outline-new':editOutline();break;case'generate':generate();break;case'accept':accept();break;case'ignore':suggestion=null;$('#suggestion-slot').innerHTML='';toast('已忽略，正文没有变化。');break;case'undo':undoAI();break;case'export':exportMarkdown();break;case'focus':focusMode=!focusMode;drawer='';render();break;case'ai-toggle':aiHidden=false;drawer=drawer==='ai'?'':'ai';render();break;case'ai-close':if(window.innerWidth<900)drawer='';else aiHidden=true;render();if(window.innerWidth>=1280)toast('AI 已收起；退出并重新打开文章可恢复。');break;case'materials-toggle':drawer=drawer==='materials'?'':'materials';render();break;case'close-drawer':drawer='';render();break;case'nav-toggle':$('.sidebar').classList.toggle('nav-open');break;case'settings':settings();break;case'sample-settings':samples();break;case'restore':articles=seeds();query='';filter='全部';render();break;case'chat-new':conversationId='c'+(++counter);conversations.unshift({id:conversationId,title:'新对话',messages:[]});navigate('assistant');break;case'chat-send':chatSend($('#chat-input').value);break;case'task-details':taskDetails=!taskDetails;render();break;}
});
document.addEventListener('change',e=>{if(e.target.dataset.included){const m=article().materials.find(m=>m.id===e.target.dataset.included);m.included=e.target.checked;touch(article());$('.ai-panel').innerHTML=aiPanel()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawer='';$('.sidebar')?.classList.remove('nav-open');$('.drawer-open')?.classList.remove('drawer-open')}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
render();
</script>
</body>
</html>
